name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unittest
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: check
        run: PYTHONPATH=src python -m zcabs check
      - name: scan
        run: PYTHONPATH=src python -m zcabs scan .
      - name: genome emits
        run: PYTHONPATH=src python -m zcabs prompt | grep -q "LOOK"

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node test
        working-directory: js
        run: node --test zcabs.test.js
